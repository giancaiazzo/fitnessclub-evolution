name: fitnessclub

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: fitnessclub_db
      POSTGRES_USER: fitnessclub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD en el archivo .env}
      N8N_DB_PASSWORD: ${N8N_DB_PASSWORD:?Defina N8N_DB_PASSWORD en el archivo .env}
      TZ: America/Montevideo
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/postgres/10-create-n8n-db.sh:/docker-entrypoint-initdb.d/10-create-n8n-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitnessclub -d fitnessclub_db"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging: *default-logging

  backend:
    build:
      context: ./BackEnd/FitnessClubEvolution.Api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Database__ApplyMigrations: "true"
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=fitnessclub_db;Username=fitnessclub;Password=${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD en el archivo .env}
      Integrations__N8n__ApiKey: ${N8N_API_KEY:?Defina N8N_API_KEY en el archivo .env}
      Integrations__N8n__RoutineWebhookUrl: ${N8N_ROUTINE_WEBHOOK_URL:-http://n8n:5678/webhook/rutina-asignada}
      Clientes__MorosidadAutomatica__Enabled: ${MOROSIDAD_AUTOMATICA_ENABLED:-false}
      Clientes__MorosidadAutomatica__DiasGracia: ${MOROSIDAD_DIAS_GRACIA:-3}
      Clientes__MorosidadAutomatica__IntervaloMinutos: ${MOROSIDAD_INTERVALO_MINUTOS:-60}
      Integrations__Hikvision__Enabled: ${HIKVISION_ENABLED:-false}
      Integrations__Hikvision__BaseUrl: ${HIKVISION_BASE_URL:-}
      Integrations__Hikvision__Username: ${HIKVISION_USERNAME:-}
      Integrations__Hikvision__Password: ${HIKVISION_PASSWORD:-}
      Integrations__Hikvision__AllowInvalidCertificate: ${HIKVISION_ALLOW_INVALID_CERTIFICATE:-false}
      Integrations__Hikvision__TimeoutSeconds: ${HIKVISION_TIMEOUT_SECONDS:-10}
      Email__Smtp__Host: ${SMTP_HOST:-}
      Email__Smtp__Port: ${SMTP_PORT:-587}
      Email__Smtp__UseSsl: ${SMTP_USE_SSL:-true}
      Email__Smtp__UserName: ${SMTP_USERNAME:-}
      Email__Smtp__Password: ${SMTP_PASSWORD:-}
      Email__Smtp__FromAddress: ${SMTP_FROM_ADDRESS:-}
      Email__Smtp__FromName: ${SMTP_FROM_NAME:-FitnessClubEvolution}
      RecoveryAccounts__Rodrigo__UserName: ${RECOVERY_RODRIGO_USERNAME:-RodrigoGue}
      RecoveryAccounts__Rodrigo__Email: ${RECOVERY_RODRIGO_EMAIL:-}
      RecoveryAccounts__Paola__UserName: ${RECOVERY_PAOLA_USERNAME:-PaoMu}
      RecoveryAccounts__Paola__Email: ${RECOVERY_PAOLA_EMAIL:-}
      Cors__AllowedOrigins__0: https://fcevolution.online
      Cors__AllowedOrigins__1: https://www.fcevolution.online
      TZ: America/Montevideo
    depends_on:
      postgres:
        condition: service_healthy
      n8n:
        condition: service_started
    volumes:
      - data_protection_keys:/home/app/.aspnet/DataProtection-Keys
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging: *default-logging

  frontend:
    build:
      context: .
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging: *default-logging

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    restart: unless-stopped
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n_db
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD:?Defina N8N_DB_PASSWORD en el archivo .env}
      N8N_HOST: n8n.fcevolution.online
      N8N_PORT: 5678
      N8N_PROTOCOL: https
      N8N_EDITOR_BASE_URL: https://n8n.fcevolution.online
      WEBHOOK_URL: https://n8n.fcevolution.online/
      N8N_PROXY_HOPS: 1
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Defina N8N_ENCRYPTION_KEY en el archivo .env}
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_RUNNERS_ENABLED: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: 336
      GENERIC_TIMEZONE: America/Montevideo
      TZ: America/Montevideo
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy
    logging: *default-logging

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
      n8n:
        condition: service_started
    logging: *default-logging

volumes:
  postgres_data:
  n8n_data:
  caddy_data:
  caddy_config:
  data_protection_keys:
